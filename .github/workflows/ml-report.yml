name: Four-model ML-P-8 experiment and slides
on:
  push:
    branches: [main]
    paths:
      - 'o_churn_synthetic.csv'
      - 'scripts/**'
      - 'ML_P8.ipynb'
      - 'requirements.txt'
      - '.github/workflows/ml-report.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compute all four algorithms, 5 median benchmarks
        run: python scripts/run_experiment.py
      - name: Generate 12-slide PowerPoint
        run: python scripts/make_presentation.py
      - name: Check Notebook Restart and Run All
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient
          notebook = nbformat.read('ML_P8.ipynb', as_version=4)
          NotebookClient(notebook, kernel_name='python3', timeout=900, resources={'metadata': {'path': '.'}}).execute()
          print('Notebook runs without error')
          PY
      - name: Publish README, metrics, charts, slides
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md outputs/ presentation/ML_P8_Comparison.pptx
          if ! git diff --cached --quiet; then
            git commit -m 'Publish measured four-model results and slides'
            git push
          fi
