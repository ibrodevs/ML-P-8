name: Evaluate ML-P-8 and publish slides
on:
  push:
    branches: [main]
    paths:
      - "o_churn_synthetic.csv"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/ml-report.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_experiment.py
      - run: python scripts/make_presentation.py
      - name: Publish report, charts and PowerPoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/ presentation/ML_P8_Comparison.pptx
          if ! git diff --cached --quiet; then
            git commit -m "Add computed ML metrics, charts and 7-slide presentation"
            git push
          fi
